name: Sync homepage content to profile README

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Dotme content
        run: curl -fsSL https://raw.githubusercontent.com/Moitr/Dotme/main/README.md -o /tmp/dotme-readme.md

      - name: Update articles and friends
        id: sync
        run: |
          updated="$(TZ=Asia/Shanghai date +%F)"
          UPDATED="$updated" node <<'NODE'
          const fs = require('node:fs');
          const readmePath = 'README.md';
          const source = fs.readFileSync('/tmp/dotme-readme.md', 'utf8').replace(/\r\n/g, '\n');
          let readme = fs.readFileSync(readmePath, 'utf8').replace(/\r\n/g, '\n');

          const section = (document, name, label) => {
            const start = `<!-- ${name}:start -->`;
            const end = `<!-- ${name}:end -->`;
            const startIndex = document.indexOf(start);
            const endIndex = document.indexOf(end);
            if (startIndex < 0 || endIndex < startIndex) throw new Error(`Missing ${name} markers in ${label}`);
            return document.slice(startIndex + start.length, endIndex).trim();
          };

          const replaceSection = (name, content) => {
            const pattern = new RegExp(`(<!-- ${name}:start -->)[\\s\\S]*?(<!-- ${name}:end -->)`);
            if (!pattern.test(readme)) throw new Error(`Missing ${name} markers in profile README`);
            readme = readme.replace(pattern, `$1\n${content}\n$2`);
          };

          const names = ['articles', 'friends'];
          const incoming = Object.fromEntries(
            names.map((name) => [name, section(source, name, 'Dotme README')]),
          );
          const changed = names.some(
            (name) => section(readme, name, 'profile README') !== incoming[name],
          );

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          if (!changed) {
            console.log('Articles and friends are unchanged; nothing to update.');
            process.exit(0);
          }

          for (const name of names) replaceSection(name, incoming[name]);
          readme = readme.replace(/^Last updated:.*$/m, `Last updated: ${process.env.UPDATED}`);
          fs.writeFileSync(readmePath, readme, 'utf8');
          NODE

      - name: Commit README update
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: sync homepage content"
          git push
